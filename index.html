<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            background: #eef3f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .clima {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        .clima h1 {
            color: #0f1c3f;
            margin-bottom: 5px;
        }
        .ciudad {
            color: #666;
            margin-bottom: 20px;
        }
        .temperatura {
            font-size: 55px;
            font-weight: bold;
            color: #0f1c3f;
            margin: 15px 0;
        }
        .estado {
            font-size: 20px;
            margin-bottom: 20px;
        }
        .datos {
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }
        .datos p {
            margin: 10px;
        }
        button {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #0f1c3f;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #1b315f;
        }
    </style>
</head>

<body>
    <div class="clima">
        <h1>🌤️ Clima</h1>
        <div class="ciudad">
            Puebla, México
        </div>
        <div class="temperatura" id="temperatura">
            -- °C
        </div>
        <div class="estado" id="estado">
            Cargando...
        </div>
        <div class="datos">
            <p id="viento">
                💨 Viento: -- km/h
            </p>
            <p id="humedad">
                💧 Humedad: -- %
            </p>
        </div>
        <button onclick="obtenerClima()">Actualizar clima</button>
    </div>


    <script>
        async function obtenerClima() {

            const latitud = 19.0414;
            const longitud = -98.2063;

            const url =
                `https://api.open-meteo.com/v1/forecast?latitude=${latitud}&longitude=${longitud}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&temperature_unit=celsius&wind_speed_unit=kmh&timezone=auto`;

            try {
                const respuesta = await fetch(url);
                const datos = await respuesta.json();
                console.log(datos);
                document.getElementById("temperatura").textContent =
                    datos.current.temperature_2m + " °C";
                document.getElementById("humedad").textContent =
                    "💧 Humedad: " +
                    datos.current.relative_humidity_2m +
                    " %";
                document.getElementById("viento").textContent =
                    "💨 Viento: " +
                    datos.current.wind_speed_10m +
                    " km/h";
                document.getElementById("estado").textContent =
                    obtenerEstado(datos.current.weather_code);
            } catch (error) {
                console.error(error);
                document.getElementById("estado").textContent =
                    "No se pudo obtener el clima";
            }
        }

        function obtenerEstado(codigo) {
            if (codigo === 0) {
                return "☀️ Despejado";
            }
            if (codigo >= 1 && codigo <= 3) {
                return "🌤️ Parcialmente nublado";
            }
            if (codigo >= 45 && codigo <= 48) {
                return "🌫️ Niebla";
            }
            if (codigo >= 51 && codigo <= 67) {
                return "🌧️ Lluvia";
            }
            if (codigo >= 71 && codigo <= 77) {
                return "❄️ Nieve";
            }
            if (codigo >= 80 && codigo <= 82) {
                return "🌦️ Chubascos";
            }
            if (codigo >= 95) {
                return "⛈️ Tormenta";
            }
            return "Clima desconocido";
        }
        obtenerClima();
    </script>
</body>
</html>
